version: "15.0"
description: Defines the public behavior of `@eliware/log`.
directives:
  - id: E-102.0
    dos:
      - Provide default and named `log` exports, `createLogger()`, and `safeSerialize()`.
      - Use native ESM and export TypeScript declarations through package exports.
      - >-
        Let users set levels, Winston transports, output formats, timestamps, and child context.
      - Put primitive and array metadata in a `value` field.
      - Reject unsupported options with TypeErrors.
      - Redact metadata fields with configured keys.
      - >-
        Serialize Error values, BigInts, primitives, arrays, cycles, and hostile values without
        secret leaks or logger failures.
      - Do not make external I/O calls during package import.
    donts:
      - >-
        Do not provide application-specific transport backends, remote record collection,
        credential storage, retention, or deployment features.
      - Do not claim that redaction detects every secret.
